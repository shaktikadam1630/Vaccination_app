<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">VaccineTrack Portal login screen</title>
  <desc id="desc">A dark login interface with VaccineTrack Portal branding, email and password fields, sign in button, and registration links.</desc>
  <defs>
    <linearGradient id="button" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#a21caf"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="#020617"/>
  <circle cx="210" cy="210" r="230" fill="#1d4ed8" opacity=".08"/>
  <circle cx="980" cy="700" r="240" fill="#9333ea" opacity=".08"/>
  <rect x="525" y="58" width="150" height="150" rx="30" fill="url(#icon)"/>
  <path d="M558 148l78-78m-50 102l-30-30m55-55l30 30m-69 76l-16-16m88-88l-16-16" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  <text x="600" y="280" fill="#f8fafc" font-family="Georgia, serif" font-size="42" font-weight="700" text-anchor="middle">VaccineTrack Portal</text>
  <text x="600" y="320" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Digital Child Vaccination Management System</text>
  <rect x="250" y="365" width="700" height="430" rx="26" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="600" y="435" fill="#f8fafc" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Sign In to Your Account</text>
  <text x="320" y="495" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">EMAIL ADDRESS</text>
  <rect x="320" y="515" width="560" height="64" rx="15" fill="#0b1224" stroke="#334155" stroke-width="2"/>
  <text x="355" y="555" fill="#64748b" font-family="Arial, sans-serif" font-size="18">name@example.com</text>
  <text x="320" y="630" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">PASSWORD</text>
  <text x="880" y="630" fill="#60a5fa" font-family="Arial, sans-serif" font-size="15" text-anchor="end">Forgot Password?</text>
  <rect x="320" y="650" width="560" height="64" rx="15" fill="#0b1224" stroke="#334155" stroke-width="2"/>
  <text x="355" y="690" fill="#64748b" font-family="Arial, sans-serif" font-size="20">••••••••••••</text>
  <rect x="320" y="742" width="560" height="64" rx="15" fill="url(#button)"/>
  <text x="600" y="783" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Sign In  →</text>
  <text x="600" y="858" fill="#64748b" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">National Health Authority  •  Encrypted &amp; Secure Digital Portal</text>
</svg>